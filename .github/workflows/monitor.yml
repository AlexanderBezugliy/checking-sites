name: Periodic Site Monitor

on:
    schedule:
        - cron: "0 6,18 * * *" # Два раза в день: 09:00 и 21:00 по Киеву (UTC+3) 
    workflow_dispatch: # Позволяет запускать кнопкой из веб-интерфейса

concurrency:
    group: monitor
    cancel-in-progress: false

jobs:
    check-status:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run monitoring script
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
              run: node monitor.js

            - name: Commit and push status.json
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet -- status.json && git diff --cached --quiet -- status.json; then
                    echo "status.json unchanged"
                    exit 0
                  fi
                  git add status.json
                  git commit -m "chore: auto-update status [skip ci]"
                  git fetch origin main
                  if ! git pull --rebase origin main; then
                    git checkout --theirs -- status.json
                    git add status.json
                    GIT_EDITOR=true git rebase --continue
                  fi
                  git push origin HEAD:main
