name: Daily Index Monitor

on:
    schedule:
        - cron: "0 7 * * *" # 10:00 по Киеву — после утреннего аптайма (06:00 UTC)
    workflow_dispatch:

concurrency:
    group: seo
    cancel-in-progress: false

jobs:
    check-index:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci

            - name: Check GSC secret shape
              env:
                  GSC_CLIENT_SECRET_JSON: ${{ secrets.GSC_CLIENT_SECRET_JSON }}
                  GSC_ACCOUNTS_JSON: ${{ secrets.GSC_ACCOUNTS_JSON }}
              run: |
                  node -e '
                    const c = process.env.GSC_CLIENT_SECRET_JSON || "";
                    const a = process.env.GSC_ACCOUNTS_JSON || "";
                    console.log("client_bytes", c.length);
                    console.log("accounts_bytes", a.length);
                    const cj = JSON.parse(c);
                    const block = cj.web || cj.installed;
                    if (!block || !block.client_id || !block.client_secret) {
                      throw new Error("GSC_CLIENT_SECRET_JSON: нет web.client_id / client_secret");
                    }
                    console.log("client_id_prefix", String(block.client_id).slice(0, 16));
                    const aj = JSON.parse(a);
                    const n = Object.values(aj).filter((v) => v && v.refreshToken).length;
                    console.log("refresh_tokens", n);
                    if (n < 1) throw new Error("GSC_ACCOUNTS_JSON: нет refreshToken");
                  '

            - name: Probe Google IPv4
              run: |
                  set -x
                  echo "ipv4 oauth2.googleapis.com:"
                  curl -4 -sS -o /dev/null -w "http=%{http_code} time=%{time_total}\n" --max-time 15 https://oauth2.googleapis.com/ || echo "ipv4 oauth FAIL"
                  echo "ipv4 urlInspection inspect:"
                  curl -4 -sS -o /dev/null -w "http=%{http_code} time=%{time_total}\n" --max-time 15 \
                    -X POST https://searchconsole.googleapis.com/v1/urlInspection/index:inspect \
                    -H "Content-Type: application/json" -d '{}' || echo "ipv4 inspect FAIL"
                  echo "ipv6 oauth2 (often hangs on GHA):"
                  curl -6 -sS -o /dev/null -w "http=%{http_code} time=%{time_total}\n" --max-time 8 https://oauth2.googleapis.com/ || echo "ipv6 FAIL/timeout"

            - name: Run index inspection
              env:
                  NODE_OPTIONS: --dns-result-order=ipv4first
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  GSC_CLIENT_SECRET_JSON: ${{ secrets.GSC_CLIENT_SECRET_JSON }}
                  GSC_ACCOUNTS_JSON: ${{ secrets.GSC_ACCOUNTS_JSON }}
              run: stdbuf -oL -eL node seo.js

            - name: Commit and push status
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: auto-update index status [skip ci]"
                  file_pattern: "status.json"
                  push_options: "--force-with-lease"
